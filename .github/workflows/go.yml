name: Go

on:
  push:
    branches: [ master ]
    tags:
      - "v*"
  pull_request:
    branches: [ master ]


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
