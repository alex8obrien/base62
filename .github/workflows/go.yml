name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod


      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
